name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true
      target:
        description: "Branch or commit to tag"
        required: true
        default: "claude/duaapp-android-setup-b37yvr"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DuaApp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Resolve release tag
        id: tag
        run: echo "name=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk "DuaApp-${{ steps.tag.outputs.name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            "DuaApp/DuaApp-${{ steps.tag.outputs.name }}.apk" \
            --target "${{ inputs.target || github.sha }}" \
            --title "DuaApp ${{ steps.tag.outputs.name }}" \
            --notes "Debug-signed build for sideloading — no release keystore is configured yet, so this is not a Play-Store-signed release artifact. Install by enabling \"install unknown apps\" and opening the APK on your device."
        working-directory: .
